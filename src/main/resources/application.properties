spring.application.name=founderportal

spring.datasource.url=jdbc:mysql://localhost:3306/founderportal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=your-very-secure-secret-key-at-least-256-bits-long-here-for-vblp-project-2024
jwt.expiration=86400000